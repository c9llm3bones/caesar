[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caesar"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "tensorboard",
  "numpy",
  "scipy",
  "tqdm",
  "biopython",
  "immutabledict",
  "ml-collections",
  "pydssp",
  "dm-tree",
  "flexloop @ git+https://github.com/mjendrusch/flexloop.git",
  "gemmi",
  "pytest>=7.0",
  "pytest-cov",
]

[project.optional-dependencies]
jax = [
  "jax[cpu]==0.5.0",
  "chex",
  "flax",
  "dm-haiku @ git+https://github.com/deepmind/dm-haiku@v0.0.14",
]
web = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
]

[project.urls]
Homepage = "https://github.com/c9llm3bones/caesar"
Source = "https://github.com/c9llm3bones/caesar"
Issues = "https://github.com/c9llm3bones/caesar/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
include = ["caesar*"]

[tool.setuptools.package-data]
"caesar.web" = ["static/static/index.html"]
